<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505"/>
      <stop offset="100%" style="stop-color:#0D0F0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#39FF14;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#39FF14;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo mark -->
  <g transform="translate(530, 160)">
    <rect x="0" y="0" width="140" height="140" rx="32" fill="#39FF14" fill-opacity="0.08" stroke="#39FF14" stroke-opacity="0.2" stroke-width="2"/>
    <text x="70" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#39FF14" text-anchor="middle">E</text>
  </g>
  <!-- Title -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#F2FFF0" text-anchor="middle" letter-spacing="-2">Eyano</text>
  <!-- Subtitle -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#F2FFF0" fill-opacity="0.4" text-anchor="middle">Assistant intelligent propuls par Gnoxe AI</text>
  <!-- Brand accent line -->
  <rect x="540" y="450" width="120" height="3" rx="1.5" fill="#39FF14" fill-opacity="0.4"/>
  <!-- URL -->
  <text x="600" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#F2FFF0" fill-opacity="0.2" text-anchor="middle">eyano.site</text>
</svg>
