<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à jour en cours - Agent IA Advanced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Effets de fond techno -->
    <div id="particles-container"></div>
    <div class="tech-grid-overlay"></div>

    <header class="page-header">
        <!-- Emplacement 1 du LOGO OFFICIEL (IMAGE 1) -->
        <div class="main-logo-wrapper">
            <img src="assets/logo.png" alt="Logo de l'Agent IA" class="main-logo">
            <div class="logo-halo-effect"></div>
        </div>
        
        <h1 class="main-title">En cours de <span class="neon-green">mise à jour</span></h1>
        <p class="thanks-msg">Merci pour vos contributions 🔥❤️</p>
        <p class="author-name">David ❤️🥂</p>
    </header>

    <main class="cinematic-container">
        
        <!-- Panneau Gauche : MISE À JOUR SYSTÈME -->
        <aside class="panel status-panel left-panel glassmorphism desktop-only">
            <div class="panel-header">
                <h2>MISE À JOUR SYSTÈME</h2>
                <div class="panel-divider"></div>
            </div>
            <div class="panel-content">
                <div class="circular-progress-wrapper">
                    <svg class="progress-ring" width="120" height="120">
                        <circle class="progress-ring__circle_bg" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                        <circle class="progress-ring__circle" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                    </svg>
                    <div class="progress-label">
                        <span class="progress-percent" id="panel-percent">72</span><span class="percent-symbol">%</span>
                    </div>
                </div>
                <ul class="steps-list">
                    <li class="active-step"><span class="status-indicator"></span>Optimisation...</li>
                    <li><span class="status-indicator"></span>Sécurité...</li>
                    <li><span class="status-indicator"></span>Performances...</li>
                    <li><span class="status-indicator"></span>Nouvelles fonctionnalités...</li>
                </ul>
            </div>
        </aside>

        <!-- Zone Centrale : Le Robot et la Plateforme -->
        <section class="robot-section">
            <div class="robot-infrastructure">
                
                <!-- Anneaux énergétiques -->
                <div class="energy-ring r-1"></div>
                <div class="energy-ring r-2"></div>
                <div class="energy-ring r-3"></div>

                <!-- Câbles connectés à l'infrastructure -->
                <div class="cables-system">
                    <div class="cable cable-tl-1"></div>
                    <div class="cable cable-tl-2"></div>
                    <div class="cable cable-tr-1"></div>
                    <div class="cable cable-tr-2"></div>
                    
                    <div class="cable cable-ml-1"></div>
                    <div class="cable cable-ml-2"></div>
                    <div class="cable cable-mr-1"></div>
                    <div class="cable cable-mr-2"></div>
                    
                    <div class="cable cable-bl-1"></div>
                    <div class="cable cable-bl-2"></div>
                    <div class="cable cable-br-1"></div>
                    <div class="cable cable-br-2"></div>
                </div>

                <!-- Le Robot Futuriste -->
                <div class="robot-assembly">
                    <div class="robot-head">
                        <div class="screen-face">
                            <div class="eyes">
                                <div class="eye left-eye"></div>
                                <div class="eye right-eye"></div>
                            </div>
                        </div>
                    </div>
                    <div class="robot-torso">
                        <div class="chest-plate">
                            <!-- Emplacement 2 du LOGO OFFICIEL (IMAGE 1) sur le torse -->
                            <img src="assets/logo.png" alt="Logo sur le robot" class="torso-logo">
                            <div class="torso-logo-glow"></div>
                        </div>
                        <div class="torso-connectors">
                            <div class="connector c-1"></div>
                            <div class="connector c-2"></div>
                            <div class="connector c-3"></div>
                        </div>
                    </div>
                    <div class="robot-platform">
                        <div class="base-plate"></div>
                        <div class="hover-rings">
                            <div class="h-ring r-inner"></div>
                            <div class="h-ring r-outer"></div>
                        </div>
                        <div class="platform-light"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Panneau Droite : CONNEXION SÉCURISÉE -->
        <aside class="panel status-panel right-panel glassmorphism desktop-only">
            <div class="panel-header">
                <h2>CONNEXION SÉCURISÉE</h2>
                <div class="panel-divider"></div>
            </div>
            <div class="panel-content">
                <div class="security-icon-wrapper">
                    <svg class="security-shield" viewBox="0 0 100 120">
                        <path d="M50 10 C60 10 90 20 90 50 C90 80 50 110 50 110 C50 110 10 80 10 50 C10 20 40 10 50 10 Z" stroke-width="6" fill="transparent"/>
                        <path d="M40 60 L48 68 L60 50" class="shield-check" stroke-width="8" stroke-linecap="round" fill="transparent"/>
                    </svg>
                    <div class="icon-halo"></div>
                </div>
                <p class="conn-status-msg">Synchronisation des données...</p>
                <div class="data-transfer-animation"></div>
            </div>
        </aside>
    </main>

    <footer class="bottom-loading-bar glassmorphism">
        <div class="message-wrapper">
            <div class="loading-spinner"></div>
            Amélioration en cours...
        </div>
        <div class="sub-message">Merci pour votre patience.</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
